[package]
name = "aibar"
version = "0.1.0"
edition = "2024"
description = "Windows 系統匣的 AI 訂閱用量小工具"
license = "MIT"
authors = ["Ray Liu"]

[dependencies]
base64 = "0.23.1"
# 本地時區格式化重置時間
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# 只啟用需要的 feature：winit 後端 + 軟體渲染器 + 系統托盤
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "accessibility",
    "backend-winit",
    "renderer-software",
    "system-tray",
    "unstable-winit-030",
] }
# 同步 HTTP；TLS 用 Windows 內建的 SChannel 與系統憑證，不另外打包根憑證
ureq = { version = "3.5.1", default-features = false, features = ["native-tls-no-default", "gzip"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Wdk_System_Threading",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.18.1"
winresource = "0.1.34"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
